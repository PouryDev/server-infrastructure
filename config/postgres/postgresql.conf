# Tuned for: 4 cores, 8 GB RAM shared with everything else, SSD, mem_limit 1280m, accessed only
# through PgBouncer (transaction pooling). Revisit after a week of real load (see Grafana).

listen_addresses = '*'
max_connections = 120                 # pgbouncer: 7 projects x (10 pool + 3 reserve) + exporter + admin
superuser_reserved_connections = 5
password_encryption = scram-sha-256
timezone = 'UTC'

# ---- memory -----------------------------------------------------------------
shared_buffers = 768MB
effective_cache_size = 2560MB         # planner hint only (page cache we expect to get), not allocated
work_mem = 8MB
hash_mem_multiplier = 2.0
maintenance_work_mem = 128MB
autovacuum_work_mem = 128MB
huge_pages = off
dynamic_shared_memory_type = posix

# ---- WAL / checkpoints ------------------------------------------------------
wal_level = replica
wal_compression = lz4
wal_buffers = 16MB
synchronous_commit = on               # no backups yet: never trade durability for speed
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 512MB

# ---- SSD / planner ----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 100
default_statistics_target = 100
jit = off                             # JIT hurts short OLTP queries more than it helps

# ---- parallelism (4 shared cores: keep it modest) ---------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# ---- background writer / autovacuum -----------------------------------------
bgwriter_delay = 100ms
bgwriter_lru_maxpages = 200
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_limit = 1000

# ---- safety nets ------------------------------------------------------------
idle_in_transaction_session_timeout = 60s
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
# statement_timeout is intentionally not global: set it per role (ALTER ROLE app SET statement_timeout = '30s').

# ---- compression ------------------------------------------------------------
default_toast_compression = lz4

# ---- observability ----------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
track_activity_query_size = 2048
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
