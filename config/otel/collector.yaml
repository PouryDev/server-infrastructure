# Single entry point for telemetry from every project: otel-collector:4317 (gRPC) / :4318 (HTTP).
#   traces  -> span metrics (ALL spans, before sampling) -> Prometheus
#           -> tail sampling -> routed by service.namespace to that project's Tempo tenant
#   metrics -> Prometheus (native OTLP receiver)
# This file is static. Per-project tenants (routing table, one exporter + pipeline each) are in tenants.yaml, written by
# scripts/project-access.py; both files are loaded (--config twice, maps are merged).
#   logs    -> dropped (no log backend). Projects should log JSON to stdout and set OTEL_LOGS_EXPORTER=none.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 200
    spike_limit_mib: 50
  # Keep every error and every slow trace, plus a percentage of the rest.
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 200
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 1000 }
      - name: sample-rest
        type: probabilistic
        probabilistic: { sampling_percentage: "${env:TRACE_SAMPLE_PERCENT:-25}" }
  batch:
    timeout: 5s
    send_batch_size: 1024

connectors:
  # RED metrics per span (calls, errors, duration histogram) computed from every span, so they are exact although
  # Tempo only keeps sampled traces. Resource attributes (service.name/namespace) carry over, so Prometheus labels them
  # job="<project>/<service>" and the per-project label proxy isolates them like any other metric.
  spanmetrics:
    namespace: traces.span.metrics
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s]
    # span.name is "GET /route" for a matched request (just "GET" for a 404), so no route dimension is needed
    dimensions:
      - name: http.response.status_code
    metrics_flush_interval: 30s
  forward/sampling: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
    headers: { X-Scope-OrgID: single-tenant }  # Tempo has multitenancy on: every write needs a tenant
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  nop:

service:
  telemetry:
    logs: { level: warn }
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus: { host: 0.0.0.0, port: 8888 }
  pipelines:
    traces/in:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [spanmetrics, forward/sampling]
    traces/sampled:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch]
      exporters: [routing/tenant]
    # spans of a namespace without a route of its own (a new project before project-access.py ran): tenant "single-tenant"
    traces/tenant-default:
      receivers: [routing/tenant]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [nop]
