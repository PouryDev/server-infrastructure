# Single entry point for telemetry from every project: otel-collector:4317 (gRPC) / :4318 (HTTP).
#   traces  -> tail sampling -> Tempo
#   metrics -> Prometheus (native OTLP receiver)
#   logs    -> dropped (no log backend). Projects should log JSON to stdout and set OTEL_LOGS_EXPORTER=none.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 8
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 200
    spike_limit_mib: 50
  # Keep every error and every slow trace, plus a percentage of the rest.
  tail_sampling:
    decision_wait: 10s
    num_traces: 20000
    expected_new_traces_per_sec: 200
    policies:
      - name: errors
        type: status_code
        status_code: { status_codes: [ERROR] }
      - name: slow
        type: latency
        latency: { threshold_ms: 1000 }
      - name: sample-rest
        type: probabilistic
        probabilistic: { sampling_percentage: "${env:TRACE_SAMPLE_PERCENT:-25}" }
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  otlphttp/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  nop:

service:
  telemetry:
    logs: { level: warn }
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus: { host: 0.0.0.0, port: 8888 }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [nop]
