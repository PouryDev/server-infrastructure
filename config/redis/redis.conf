# Shared Redis. Password (default user) is passed on the command line from REDIS_PASSWORD;
# per-project users live in /data/users.acl and are created by scripts/new-project.sh.
bind 0.0.0.0
protected-mode yes
port 6379
aclfile /data/users.acl

# ---- memory -----------------------------------------------------------------
# mem_limit is 640m: 384mb of data + room for AOF-rewrite copy-on-write and client buffers.
maxmemory 384mb
# Only keys with a TTL are evicted. Cache keys MUST set a TTL; keys without one are never evicted
# (writes then fail with OOM instead of silently dropping durable data).
maxmemory-policy volatile-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
activedefrag no

# ---- persistence ------------------------------------------------------------
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 3600 1 300 100 60 10000
dir /data

# ---- network / clients ------------------------------------------------------
tcp-backlog 1024
tcp-keepalive 60
timeout 300
maxclients 4000

# ---- misc -------------------------------------------------------------------
hz 10
dynamic-hz yes
io-threads 1
loglevel notice
slowlog-log-slower-than 10000
slowlog-max-len 256
