# Project: gapchi   (generated by scripts/new-project.sh)
server {
    listen 80;
    server_name gapchi.localhost;
    set $upstream_client http://gapchi-web:8080;

    # API on the same domain under /api (the prefix is forwarded to the backend unchanged)
    location /api/ {
        client_max_body_size 20m;
        limit_req zone=api_perip burst=60 nodelay;
        limit_conn conn_perip 50;
        set $upstream_api http://gapchi-api:8080;
        proxy_pass $upstream_api;
        include /etc/nginx/snippets/proxy.conf;
    }
    # Browser WebSocket of voice calls (served by the API at the root path, long-lived)
    location /voice-ws/ {
        set $upstream_api http://gapchi-api:8080;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID      $req_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream off;
    }
    location / {
        proxy_pass $upstream_client;
        include /etc/nginx/snippets/proxy.conf;
    }
}

