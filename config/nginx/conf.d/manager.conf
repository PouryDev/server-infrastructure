# Private infrastructure manager. Keep anti-indexing headers on proxy errors too.
server {
    listen 80;
    server_name manager.localhost;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store" always;
    location = /api/deployments/upload {
        set $manager_upstream http://manager:8080;
        proxy_pass $manager_upstream;
        include /etc/nginx/snippets/manager-upload.conf;
        proxy_request_buffering off;
        client_body_timeout 1800s;
        client_max_body_size 2g;
    }
    location /api/deployments/ {
        set $manager_upstream http://manager:8080;
        proxy_pass $manager_upstream;
        include /etc/nginx/snippets/proxy.conf;
        client_max_body_size 128k;
    }
    location = /api/shipping/plans {
        set $manager_upstream http://manager:8080;
        proxy_pass $manager_upstream;
        include /etc/nginx/snippets/proxy.conf;
        client_max_body_size 256k;
    }
    location /api/env/ {
        set $manager_upstream http://manager:8080;
        proxy_pass $manager_upstream;
        include /etc/nginx/snippets/proxy.conf;
        client_max_body_size 256k;
    }
    location / {
        set $manager_upstream http://manager:8080;
        proxy_pass $manager_upstream;
        include /etc/nginx/snippets/proxy.conf;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Cache-Control;
        limit_req zone=api_perip burst=15 nodelay;
        client_max_body_size 8k;
    }
}
