# Local Go preview on the shared nginx. Upstream DNS is resolved by the infra resolver.
server {
    listen 80;
    server_name didchi.localhost;
    set $upstream_client http://didchi-platform-api:8080;

    location /api/ {
        client_max_body_size 20m;
        limit_req zone=api_perip burst=60 nodelay;
        limit_conn conn_perip 50;
        proxy_pass $upstream_client;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        proxy_pass $upstream_client;
        include /etc/nginx/snippets/proxy.conf;
    }
}
