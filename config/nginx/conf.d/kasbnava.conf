# Project: kasbnava
server {
    listen 80;
    server_name kasbnava.localhost;
    set $upstream_client http://kasbnava-web:8080;

    # API on the same domain under /api (the prefix is forwarded to the backend unchanged)
    location /api/ {
        client_max_body_size 20m;
        limit_req zone=api_perip burst=60 nodelay;
        limit_conn conn_perip 50;
        set $upstream_api http://kasbnava-api:8080;
        proxy_pass $upstream_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location / {
        proxy_pass $upstream_client;
        include /etc/nginx/snippets/proxy.conf;
    }
}
