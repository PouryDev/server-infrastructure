# Shared edge nginx. Plain HTTP only: TLS terminates at the CDN (ArvanCloud), which connects to
# this server on port 80. One file per project in conf.d/ (created by scripts/new-project.sh).

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept off;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---- real client IP (CDN sits in front) ---------------------------------
    include /etc/nginx/snippets/realip.conf;

    # ---- logging (JSON to stdout, rotated by docker) ------------------------
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }
    log_format json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream":"$upstream_addr","request_id":"$req_id",'
        '"traceparent":"$http_traceparent","ua":"$http_user_agent","cache":"$upstream_cache_status"}';
    access_log /dev/stdout json buffer=32k flush=5s;

    # ---- performance --------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    types_hash_max_size 2048;
    keepalive_timeout 65;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_body_buffer_size 128k;
    client_max_body_size 10m;           # override per server for upload endpoints
    large_client_header_buffers 4 16k;

    open_file_cache max=2000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_errors on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # ---- upstream resolution ------------------------------------------------
    # proxy_pass uses variables + Docker DNS, so nginx starts even when a project is down and
    # one broken project never takes the others (or nginx itself) down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # ---- rate limiting (zones are used from the per-project templates) ------
    limit_req_zone  $binary_remote_addr zone=api_perip:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # ---- internal status for the exporter / healthcheck ---------------------
    server {
        listen 8081;
        allow 127.0.0.1;
        allow 10.99.250.0/24;
        deny all;
        access_log off;
        location = /nginx_status { stub_status; }
    }

    include /etc/nginx/conf.d/*.conf;
}
