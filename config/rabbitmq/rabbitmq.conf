# Container mem_limit is 512m. The watermark is absolute (not relative) so it does not depend on
# how RabbitMQ detects the cgroup limit; publishers are blocked at 300 MB, leaving headroom
# for the Erlang VM and GC spikes.
vm_memory_high_watermark.absolute = 300MB
vm_memory_calculation_strategy = rss
disk_free_limit.absolute = 2GB

# ---- connections ------------------------------------------------------------
channel_max = 256
heartbeat = 60
tcp_listen_options.backlog = 512
tcp_listen_options.nodelay = true
tcp_listen_options.keepalive = true

# ---- cheaper management / stats --------------------------------------------
collect_statistics_interval = 15000
management.rates_mode = none

# ---- safe defaults ----------------------------------------------------------
loopback_users.guest = true
log.console = true
log.console.level = warning
log.file = false
