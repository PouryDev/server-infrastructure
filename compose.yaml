# Shared infrastructure for all projects on this server.
#
#   infra             shared network every project joins (external: true in their compose files)
#   infra-data        postgres <-> pgbouncer <-> postgres-exporter only
#   infra-monitoring  prometheus / grafana / tempo / exporters (fixed subnet: node-exporter runs
#                     on the host network and listens on this network's gateway address)
#
# Memory budget (mem_limit): see README.md. Everything has a hard limit so one service can never
# starve the others (and the kernel OOM killer never picks Postgres for us).

name: infra

x-base: &base
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  infra:
    name: infra
  data:
    name: infra-data
  monitoring:
    name: infra-monitoring
    ipam:
      config:
        - subnet: 10.99.250.0/24
          gateway: 10.99.250.1

services:
  # ===========================================================================
  # Data
  # ===========================================================================
  postgres:
    <<: *base
    image: ${REGISTRY}/postgres:18.6-alpine
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGBOUNCER_AUTH_PASSWORD: ${PGBOUNCER_AUTH_PASSWORD:?set in .env}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?set in .env}
    volumes:
      - ${DATA_DIR}/postgres:/var/lib/postgresql
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    shm_size: 256m
    mem_limit: 1280m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [data]

  pgbouncer:
    <<: *base
    image: ${REGISTRY}/edoburu/pgbouncer:v1.26.1-p0
    environment:
      # Wildcard database: any db that exists on the server is reachable. Client auth is checked
      # against Postgres itself through auth_query, so new projects need no pgbouncer change.
      DATABASE_URL: postgres://pgbouncer_auth:${PGBOUNCER_AUTH_PASSWORD}@postgres:5432
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_DBNAME: postgres
      AUTH_QUERY: SELECT usename, passwd FROM public.pgbouncer_get_auth($$1)
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "10"
      RESERVE_POOL_SIZE: "3"
      RESERVE_POOL_TIMEOUT: "3"
      MAX_DB_CONNECTIONS: "25"
      MAX_PREPARED_STATEMENTS: "200"
      SERVER_IDLE_TIMEOUT: "300"
      SERVER_LIFETIME: "3600"
      QUERY_WAIT_TIMEOUT: "30"
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      LOG_CONNECTIONS: "0"
      LOG_DISCONNECTIONS: "0"
      STATS_PERIOD: "60"
    mem_limit: 64m
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
    networks: [infra, data]

  redis:
    <<: *base
    image: ${REGISTRY}/redis:8.10.3-alpine
    user: "999:1000"
    # With an aclfile, --requirepass is ignored (default user would be left passwordless), so the
    # default user's line in /data/users.acl is rewritten from REDIS_PASSWORD on every start.
    # Project users added by new-project.sh are preserved.
    command:
      - sh
      - -c
      - |
        f=/data/users.acl; touch "$$f"
        h=$$(printf %s "$$REDIS_PASSWORD" | sha256sum | cut -d' ' -f1)
        { echo "user default on #$$h ~* &* +@all"; grep -v '^user default ' "$$f" || true; } > "$$f.new"
        mv "$$f.new" "$$f"
        exec redis-server /usr/local/etc/redis/redis.conf
    environment:
      TZ: ${TZ:-UTC}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - ${DATA_DIR}/redis:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    read_only: true
    mem_limit: 640m
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    sysctls:
      net.core.somaxconn: 1024
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [infra, monitoring]

  rabbitmq:
    <<: *base
    image: ${REGISTRY}/rabbitmq:4.3.7-management-alpine
    hostname: rabbitmq
    user: "100:101"
    environment:
      TZ: ${TZ:-UTC}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?set in .env}
      # 2 Erlang schedulers and no busy-waiting: far lower idle CPU on a shared 4-core box.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - ${DATA_DIR}/rabbitmq:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tuning.conf:ro
      - ./config/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    mem_limit: 512m
    cap_drop: [ALL]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [infra, monitoring]

  # ===========================================================================
  # Edge
  # ===========================================================================
  nginx:
    <<: *base
    image: ${REGISTRY}/nginx:1.30.6-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/snippets:/etc/nginx/snippets:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    read_only: true
    mem_limit: 128m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    sysctls:
      net.core.somaxconn: 4096
      net.ipv4.ip_local_port_range: "10240 65535"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/nginx_status"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [infra, monitoring]

  # ===========================================================================
  # Observability
  # ===========================================================================
  otel-collector:
    <<: *base
    image: ${REGISTRY}/otel/opentelemetry-collector-contrib:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 220MiB
      TRACE_SAMPLE_PERCENT: ${TRACE_SAMPLE_PERCENT:-25}
    volumes:
      - ./config/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    cap_drop: [ALL]
    networks: [infra, monitoring]

  tempo:
    <<: *base
    image: ${REGISTRY}/grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    environment:
      GOMEMLIMIT: 320MiB
    volumes:
      - ${DATA_DIR}/tempo:/var/tempo
      - ./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    read_only: true
    mem_limit: 384m
    cpus: 1.0
    cap_drop: [ALL]
    networks: [monitoring]

  prometheus:
    <<: *base
    image: ${REGISTRY}/prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-10d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-6GB}
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
    environment:
      GOMEMLIMIT: 420MiB
    volumes:
      - ${DATA_DIR}/prometheus:/prometheus
      - ./config/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [monitoring]

  alertmanager:
    <<: *base
    image: ${REGISTRY}/prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ${DATA_DIR}/alertmanager:/alertmanager
      - ./config/alertmanager:/etc/alertmanager:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    read_only: true
    mem_limit: 64m
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [monitoring]

  grafana:
    <<: *base
    image: ${REGISTRY}/grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 300MiB
    volumes:
      - ${DATA_DIR}/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    tmpfs: [/tmp]
    mem_limit: 384m
    cpus: 1.0
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus: { condition: service_healthy }
    networks: [monitoring]

  # ---- exporters --------------------------------------------------------------
  # Host network on purpose: in a bridge network node_exporter would report the container's own
  # NIC counters instead of the server's. It listens on the monitoring bridge gateway only, never
  # on a public address. depends_on guarantees that bridge exists first.
  node-exporter:
    <<: *base
    image: ${REGISTRY}/prom/node-exporter:v1.12.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=10.99.250.1:9100
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker/.+|var/lib/docker/.+)($$|/)
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$
      - --no-collector.ipvs
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    cap_drop: [ALL]
    depends_on:
      prometheus: { condition: service_healthy }

  cadvisor:
    <<: *base
    image: ${CADVISOR_IMAGE}
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,process,memory_numa,disk
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    mem_limit: 192m
    cpus: 0.5
    cap_drop: [ALL]
    networks: [monitoring]

  postgres-exporter:
    <<: *base
    image: ${REGISTRY}/prometheuscommunity/postgres-exporter:v0.20.1
    command: ["--collector.stat_statements"]
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${POSTGRES_EXPORTER_PASSWORD}@postgres:5432/postgres?sslmode=disable
    read_only: true
    mem_limit: 64m
    cap_drop: [ALL]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data, monitoring]

  redis-exporter:
    <<: *base
    image: ${REGISTRY}/oliver006/redis_exporter:v1.97.0-alpine
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    read_only: true
    mem_limit: 48m
    cap_drop: [ALL]
    depends_on:
      redis: { condition: service_healthy }
    networks: [monitoring]

  nginx-exporter:
    <<: *base
    image: ${REGISTRY}/nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://nginx:8081/nginx_status"]
    read_only: true
    mem_limit: 32m
    cap_drop: [ALL]
    networks: [monitoring]

  blackbox:
    <<: *base
    image: ${REGISTRY}/prom/blackbox-exporter:v0.29.1
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./config/blackbox:/etc/blackbox:ro
    read_only: true
    mem_limit: 48m
    cap_drop: [ALL]
    networks: [monitoring]
