# Install: sudo cp host/99-infra.conf /etc/sysctl.d/ && sudo sysctl --system
# (lines starting with "-" are ignored if the key does not exist, e.g. conntrack before its module loads)

# Redis: allow fork() for AOF rewrite / RDB under memory pressure.
vm.overcommit_memory = 1
# Prefer dropping page cache over swapping out database memory.
vm.swappiness = 10
vm.max_map_count = 262144
vm.dirty_background_ratio = 5
vm.dirty_ratio = 20

# Many short-lived proxy connections (nginx -> backends, CDN -> nginx).
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 30
net.ipv4.tcp_keepalive_time = 120
net.ipv4.tcp_keepalive_intvl = 20
net.ipv4.tcp_keepalive_probes = 5
-net.netfilter.nf_conntrack_max = 262144

fs.file-max = 1048576
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
