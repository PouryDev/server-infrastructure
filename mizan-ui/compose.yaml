# Local stack of the accounting UI (DEV ONLY): PostgreSQL 18 + mizan API + the UI dev server, one origin (http://localhost:5173).
# Start it with `scripts/mizan-ui.sh up`; never run `docker compose` on this file by hand (it needs the env file and project name).
name: mizan-ui

services:
  db:
    image: ${REGISTRY:-docker.arvancloud.ir}/postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mizan
    volumes: [db-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mizan"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: ${REGISTRY:-docker.arvancloud.ir}/library/golang:1.26-alpine
    working_dir: /src/mizan
    command: ["sh", "-c", "go build -o /tmp/mizan-dev ./cmd/mizan-dev && exec /tmp/mizan-dev"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/mizan?sslmode=disable
      HTTP_ADDR: ":8080"
      DEV_USER: ${DEV_USER}
      DEV_PASSWORD: ${DEV_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SEED: "true"
      CGO_ENABLED: "0"
      GOCACHE: /go/.buildcache
      GOTOOLCHAIN: local
      GOFLAGS: -buildvcs=false
      GOPROXY: file:///go/pkg/mod/cache/download,https://proxy.golang.org,direct
      HOME: /tmp
    volumes:
      - ../:/src
      - gokit-cache:/go
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 100

  ui:
    image: ${NODE_IMAGE}
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    command: ["npm", "run", "dev"]
    environment:
      API_URL: http://api:8080
      HOME: /tmp
    volumes: [".:/app"]
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60

volumes:
  db-data:
  gokit-cache:
    external: true
