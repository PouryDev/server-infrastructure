root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "vendor", ".kit"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = false

[misc]
  clean_on_exit = true
